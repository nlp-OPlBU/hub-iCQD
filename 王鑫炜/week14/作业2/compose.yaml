name: wxw-week14
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    ports: ['127.0.0.1:16379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.0.1
    ports: ['127.0.0.1:19092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 30
  api:
    profiles: [app]
    build: .
    image: wxw-week14-rag:local
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, '8014']
    ports: ['127.0.0.1:8014:8014']
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATA_DIR: /data
    volumes: [./runtime:/data]
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
  worker:
    profiles: [app]
    image: wxw-week14-rag:local
    build: .
    command: [python, -m, app.worker]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATA_DIR: /data
    volumes: [./runtime:/data]
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
volumes:
  redis-data:
  kafka-data:
