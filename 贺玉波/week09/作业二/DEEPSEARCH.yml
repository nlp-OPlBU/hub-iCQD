    - data:
        code: "import json\nimport re\n\nMAX_QUERIES = 30\n\ndef _extract_json(text):\n\
          \    if text is None:\n        return None\n    if isinstance(text, (dict,\
          \ list)):\n        return text\n    if not isinstance(text, str):\n    \
          \    return None\n    s = text.strip()\n    s = re.sub(r'<think>[\\s\\S]*?</think>',\
          \ '', s, flags=re.IGNORECASE)\n    s = s.replace('```json', '').replace('```',\
          \ '').strip()\n\n    try:\n        return json.loads(s)\n    except Exception:\n\
          \        pass\n\n    for left, right in (('{', '}'), ('[', ']')):\n    \
          \    start = s.find(left)\n        end = s.rfind(right)\n        if start\
          \ != -1 and end > start:\n            try:\n                return json.loads(s[start:end\
          \ + 1])\n            except Exception:\n                continue\n    return\
          \ None\n\ndef _collect(value, out):\n    if value is None:\n        return\n\
          \    if isinstance(value, str):\n        v = value.strip()\n        if v:\n\
          \            out.append(v)\n        return\n    if isinstance(value, list):\n\
          \        for item in value:\n            _collect(item, out)\n        return\n\
          \    if isinstance(value, dict):\n        for key in (\"search_query\",\
          \ \"search_queries\", \"queries\",\n                    \"search_questions\"\
          , \"questions\", \"query\",\n                    \"搜索问题\", \"搜索词\"):\n \
          \           if key in value:\n                _collect(value[key], out)\n\
          \        for v in value.values():\n            _collect(v, out)\n\ndef main(agent_output:\
          \ str) -> dict:\n    data = _extract_json(agent_output)\n    raw = []\n\
          \    _collect(data, raw)\n\n    # 兜底逻辑：如果 JSON 解析失败（raw 为空），尝试从原始文本提取带有数字编号的查询\n\
          \    if not raw and agent_output:\n        # 移除 <think> 标签，保留内容用于正则提取\n\
          \        clean_text = re.sub(r'<think>|</think>', '', agent_output)\n  \
          \      # 匹配类似 \"1. 中国花炮产业...\" 或 \"- 烟花爆竹...\" 的格式\n        matches = re.findall(r'(?:^\\\
          d+\\.|^-|\\*)\\s*(.+?)(?=\\n|$)', clean_text, flags=re.MULTILINE)\n    \
          \    for m in matches:\n            q = m.strip()\n            # 过滤掉太短、包含\"\
          查询\"、\"要求\"、\"格式\"等非查询词\n            if 5 <= len(q) <= 50 and not any(w\
          \ in q for w in [\"查询\", \"要求\", \"格式\", \"输出\", \"RQ\", \"sub\", \"question\"\
          ]):\n                raw.append(q)\n\n    seen = set()\n    queries = []\n\
          \    for q in raw:\n        q = q.strip()\n        if q and q not in seen:\n\
          \            seen.add(q)\n            queries.append(q)\n        if len(queries)\
          \ >= MAX_QUERIES:\n            break\n\n    return {\"qresult\": queries}"
        code_language: python3
