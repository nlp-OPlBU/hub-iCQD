            {\n  \"research_questions\": [\n    {\n      \"id\": \"RQ1\",\n      \"\
            question\": \"子问题\",\n      \"queries\": [\"检索查询1\", \"检索查询2\"]\n    }\n\
            \  ],\n  \"search_query\": [\"检索查询1\", \"检索查询2\"]\n}\n\n要求：\n1. 总查询数 25-30\
            \ 条，search_query 必须包含所有 queries。\n2. 以中文为主，必要时加入 2-5 条英文查询。\n3. 每条查询 10-40\
            \ 个字符，具体、可直接用于搜索引擎或学术数据库。\n4. 覆盖：现状、数据、案例、方法、工具、趋势、风险、争议、长尾场景、关键人物/机构/产品。\n\
            5. 不要编造具体数据、人物观点、来源。\n6. 若主题过宽，自动增加时间、地域、行业、人群限定。\n7. 禁止输出\"以下是\"\"分析\"\
            \"维度\"等额外内容。\n\n现在只输出 JSON。\n"
