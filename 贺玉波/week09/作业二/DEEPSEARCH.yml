    - data:
        code: "import re\n\ndef _flat(x):\n    if isinstance(x, dict):\n        if\
          \ \"url\" in x:\n            return [x]\n        out = []\n        for v\
          \ in x.values():\n            out += _flat(v)\n        return out\n    if\
          \ isinstance(x, list):\n        out = []\n        for v in x:\n        \
          \    out += _flat(v)\n        return out\n    return []\n\ndef _norm(url):\n\
          \    return url.split(\"#\")[0].rstrip(\"/\").lower()\n\ndef main(topic:\
          \ str, sources_1, results_2) -> dict:\n    all_rows = list(sources_1 or\
          \ []) + _flat(results_2)\n    seen = set()\n    sources = []\n    for r\
          \ in all_rows:\n        url = str(r.get(\"url\") or \"\").strip()\n    \
          \    if not url:\n            continue\n        k = _norm(url)\n       \
          \ if k in seen:\n            continue\n        seen.add(k)\n        sources.append({\n\
          \            \"title\": str(r.get(\"title\") or url)[:200],\n          \
          \  \"url\": url,\n            \"snippet\": re.sub(r\"\\s+\", \" \", str(r.get(\"\
          snippet\") or \"\"))[:800],\n            \"site\": str(r.get(\"site\") or\
          \ \"\")[:100],\n            \"date\": str(r.get(\"date\") or \"\")[:50]\n\
          \        })\n\n    sources = sources[:20]\n\n    lines = []\n    for i,\
          \ s in enumerate(sources, 1):\n        lines.append(\n            f\"[{i}]\
          \ {s['title']}\\n\"\n            f\"URL: {s['url']}\\n\"\n            f\"\
          来源: {s['site']} {s['date']}\\n\"\n            f\"摘要: {s['snippet']}\"\n\
          \        )\n    evidence_text = \"\\n\\n\".join(lines)\n    source_list\
          \ = \"\\n\".join([f\"- [{s['title']}]({s['url']})\" for s in sources])\n\
          \    bundle = (\n        f\"研究主题：{topic}\\n\\n\"\n        f\"===证据材料===\\\
          n{evidence_text}\\n\\n\"\n        f\"===参考来源===\\n{source_list}\"\n    )\n\
          \    return {\n        \"evidence_text\": evidence_text,\n        \"source_list\"\
          : source_list,\n        \"research_bundle\": bundle,\n        \"sources\"\
          : sources,\n        \"source_count\": len(sources)\n    }\n"
