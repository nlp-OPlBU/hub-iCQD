    - data:
        code: "import json\nimport re\n\ndef _extract_json(text):\n    if isinstance(text,\
          \ dict):\n        return text\n    if not isinstance(text, str):\n     \
          \   return {}\n    s = text.strip()\n    s = re.sub(r'<think>[\\s\\S]*?</think>',\
          \ '', s, flags=re.I)\n    s = s.replace('```json', '').replace('```', '').strip()\n\
          \    try:\n        return json.loads(s)\n    except Exception:\n       \
          \ pass\n    for l, r in (('{', '}'), ('[', ']')):\n        st = s.find(l)\n\
          \        en = s.rfind(r)\n        if st != -1 and en > st:\n           \
          \ try:\n                return json.loads(s[st:en + 1])\n            except\
          \ Exception:\n                continue\n    return {}\n\ndef main(agent_output:\
          \ str, topic: str) -> dict:\n    data = _extract_json(agent_output)\n  \
          \  sufficient = bool(data.get(\"sufficient\", False))\n    try:\n      \
          \  confidence = int(data.get(\"confidence\", 0))\n    except Exception:\n\
          \        confidence = 0\n    gaps = data.get(\"gaps\") or []\n    if not\
          \ isinstance(gaps, list):\n        gaps = [str(gaps)]\n\n    queries = data.get(\"\
          extra_queries\") or data.get(\"queries\") or []\n    if not isinstance(queries,\
          \ list):\n        queries = []\n\n    cleaned = []\n    seen = set()\n \
          \   for q in queries:\n        q = str(q).strip()\n        if q and q not\
          \ in seen:\n            seen.add(q)\n            cleaned.append(q)\n\n \
          \   if len(cleaned) < 3:\n        base = (topic or \"该主题\").strip()\n  \
          \      for q in [f\"{base} 最新进展\", f\"{base} 典型案例\", f\"{base} 风险与争议\"]:\n\
          \            if q not in seen:\n                seen.add(q)\n          \
          \      cleaned.append(q)\n\n    cleaned = cleaned[:15]\n    need_round2\
          \ = not (sufficient and confidence >= 75)\n\n    return {\n        \"extra_queries\"\
          : cleaned,\n        \"sufficient\": sufficient,\n        \"confidence\"\
          : confidence,\n        \"gaps\": gaps,\n        \"need_round2\": \"yes\"\
          \ if need_round2 else \"no\"\n    }\n"
