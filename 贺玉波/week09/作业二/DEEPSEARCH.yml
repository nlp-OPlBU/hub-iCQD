    - data:
        code: "import json\nimport re\n\ndef _load(x):\n    if isinstance(x, (dict,\
          \ list)):\n        return x\n    if isinstance(x, str):\n        s = x.strip()\n\
          \        s = re.sub(r'<think>[\\s\\S]*?</think>', '', s, flags=re.I)\n \
          \       s = s.replace('```json', '').replace('```', '').strip()\n      \
          \  try:\n            return json.loads(s)\n        except Exception:\n \
          \           return {}\n    return {}\n\ndef _walk(obj):\n    out = []\n\
          \    if isinstance(obj, dict):\n        if any(k in obj for k in (\"url\"\
          , \"link\", \"href\")):\n            out.append(obj)\n        for v in obj.values():\n\
          \            out.extend(_walk(v))\n    elif isinstance(obj, list):\n   \
          \     for v in obj:\n            out.extend(_walk(v))\n    return out\n\n\
          def _first(d, keys, default=\"\"):\n    for k in keys:\n        v = d.get(k)\n\
          \        if v is not None and str(v).strip():\n            return str(v).strip()\n\
          \    return default\n\ndef main(body: str, item: str) -> dict:\n    data\
          \ = _load(body)\n    raw = _walk(data)\n    results = []\n    seen = set()\n\
          \    for it in raw:\n        url = _first(it, (\"url\", \"link\", \"href\"\
          ))\n        if not url:\n            continue\n        key = url.split(\"\
          #\")[0].rstrip(\"/\")\n        if key in seen:\n            continue\n \
          \       seen.add(key)\n        title = _first(it, (\"name\", \"title\"),\
          \ url)\n        snippet = _first(it, (\"summary\", \"snippet\", \"description\"\
          , \"content\"))\n        site = _first(it, (\"siteName\", \"site\"))\n \
          \       date = _first(it, (\"dateLastCrawled\", \"date\", \"publishedDate\"\
          , \"datePublished\"))\n        results.append({\n            \"query\":\
          \ item,\n            \"title\": title[:200],\n            \"url\": url,\n\
          \            \"snippet\": re.sub(r\"\\s+\", \" \", snippet)[:500],\n   \
          \         \"site\": site[:100],\n            \"date\": date[:50]\n     \
          \   })\n        if len(results) >= 10:\n            break\n    return {\"\
          results\": results}\n"
