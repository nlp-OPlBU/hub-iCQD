; 进程托管：中间件（10）→ vLLM（20）→ 应用（30）
; api / vllm 设 autostart=false，由 deploy/scripts/up.sh 按依赖顺序拉起，避免反复重启
[unix_http_server]
file=/workspace/week14/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/week14/logs/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3
loglevel=info
pidfile=/workspace/week14/run/supervisord.pid
nodaemon=false
minfds=65535
environment=PATH="/usr/local/miniconda3/envs/py312/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/week14/run/supervisor.sock

[program:mysqld]
command=/bin/bash -lc "mkdir -p /var/run/mysqld && chown mysql:mysql /var/run/mysqld && exec /usr/sbin/mysqld --user=mysql"
priority=10
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/week14/logs/mysqld.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2

[program:redis]
command=/workspace/software/redis-7.2.5/src/redis-server /workspace/week14/deploy/redis.conf
priority=10
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspace/week14/logs/redis.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2

[program:kafka]
command=/workspace/software/kafka_2.13-4.4.0/bin/kafka-server-start.sh /workspace/week14/deploy/kafka/server.properties
priority=10
autostart=true
autorestart=true
startsecs=15
stopwaitsecs=60
stopasgroup=true
killasgroup=true
environment=KAFKA_HEAP_OPTS="-Xmx1G -Xms1G"
redirect_stderr=true
stdout_logfile=/workspace/week14/logs/kafka.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2

; Milvus Lite 独立服务：api 与 worker 连同一个 gRPC 服务共享向量库
; （本地 .db 文件模式是单进程独占，worker 写入会拿不到锁）
[program:milvus]
command=/usr/local/miniconda3/envs/py312/bin/python -m milvus_lite server --data-dir /workspace/week14/data/milvus/rag.db --host 127.0.0.1 --port 19530
priority=20
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/week14/logs/milvus.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2

[program:vllm]
command=/usr/local/miniconda3/envs/py312/bin/vllm serve /workspace/models/Qwen2.5-VL-7B-Instruct --served-model-name qwen2.5-vl-7b --host 0.0.0.0 --port 8000 --gpu-memory-utilization 0.72 --max-model-len 8192 --max-num-seqs 4 --limit-mm-per-prompt '{"image":4}'
priority=20
autostart=false
autorestart=true
startsecs=240
startretries=2
stopwaitsecs=60
environment=CUDA_VISIBLE_DEVICES="0"
redirect_stderr=true
stdout_logfile=/workspace/week14/logs/vllm.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=2

[program:api]
command=/usr/local/miniconda3/envs/py312/bin/python -m app
directory=/workspace/week14/backend
priority=30
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=20
environment=PYTHONPATH="/workspace/week14/backend",PYTHONUNBUFFERED="1"
redirect_stderr=false
stdout_logfile=/workspace/week14/logs/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

; ingest-worker：Kafka 消费 + MinerU 解析（CPU），必须在 kafka/api 之后起
[program:worker]
command=/usr/local/miniconda3/envs/py312/bin/python -m app.worker.ingest_worker
directory=/workspace/week14/backend
priority=31
autostart=false
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=PYTHONPATH="/workspace/week14/backend",PYTHONUNBUFFERED="1"
redirect_stderr=false
stdout_logfile=/workspace/week14/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
