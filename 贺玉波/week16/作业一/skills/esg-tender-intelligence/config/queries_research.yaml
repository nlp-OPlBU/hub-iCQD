year_suffixes: []

domains:
  priority: ["ccgp.gov.cn", "qixin.com", "chnenergybidding.com.cn", "cntaiping.com",
             "cg.gt.cn", "crrcgc.cc", "bidding.csg.cn", "stockstar.com", "ixbang.com",
             "bidcenter.com.cn", "fgw.beijing.gov.cn", "emslg.com", "juhua.ccccnet.com"]
  block: ["docin.com", "renrendoc.com", "book118.com", "wenku.", "baike.baidu.com"]

filters:
  must_match: ["中标", "成交", "结果公告", "结果公示", "候选人", "中选", "采购结果"]
  exclude: ["招聘", "培训课程", "考证", "代写", "论文", "范文", "模板下载", "Access Restricted"]
