            \n\n## 任务\n根据下面的报告草稿 {{#1789660363827.output#}}（每个关键词一段正文）、来源列表和置信度说明，输出报告元信息：\n\
            1. title：报告标题（简洁、准确）\n2. summary：摘要，200~400 字，概括报告核心内容\n3. key_conclusions：4~6\
            \ 条关键结论。每条结论的 sources 只能引用来源列表中真实存在的 url/title；\n   没有来源支撑的结论，is_model_inference\
            \ 必须为 true，且 text 以「（模型推断）」开头。\n4. open_questions：0~5 条遗留问题 / 信息缺口。\n\
            5.输出必须是合法 JSON（可被 json.loads 直接解析）。字符串内部严禁使用英文半角\n双引号 \"，引用一律用中文引号「」或“”，否则会破坏\
            \ JSON 语法导致整个研究失败。\n\n只输出一个 JSON 对象，用 ```json 代码块包裹，格式如下：\n\n```json\n\
            {\n  \"title\": \"报告标题\",\n  \"summary\": \"摘要文字\",\n  \"key_conclusions\"\
            : [\n    {\"text\": \"结论1\", \"sources\": [{\"url\": \"真实存在的URL\", \"\
            title\": \"对应标题\"}], \"is_model_inference\": false},\n    {\"text\": \"\
            （模型推断）结论2\", \"sources\": [], \"is_model_inference\": true}\n  ],\n  \"\
            open_questions\": [\"遗留问题1\"]\n}\n```"
