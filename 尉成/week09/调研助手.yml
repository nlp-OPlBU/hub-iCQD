            针对{{#sys.query#}}，设计 3~5 个高区分度的搜索关键词，用于逐一检索网页资料。

            要求：

            1. 关键词要覆盖主题的不同侧面（定义与现状、关键玩家、趋势、争议点等），彼此尽量不重复。

            2. 关键词要具体、可直接用于搜索引擎，不要过于宽泛或过于狭窄。

            3. 只输出一个 JSON 对象，用 ```json 代码块包裹，格式如下：

            ```json

            {"keywords": ["关键词1", "关键词2", "关键词3"]}

            ```

            4. 请只输出纯 JSON 对象，不要包含任何解释性文字，不要使用 Markdown 代码块。'
