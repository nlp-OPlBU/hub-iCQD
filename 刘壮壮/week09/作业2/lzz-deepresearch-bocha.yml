    - data:
        code: "from typing import List, Dict, Any\n\ndef main(iteration_results: List[Dict[str,\
          \ Any]]) -> dict:\n    if not iteration_results:\n        return {\n   \
          \         \"total_context\": \"未获取到任何检索数据\"\n        }\n\n    merged_sections\
          \ = []\n    global_index = 1\n\n    # 遍历每个子问题的检索结果\n    for q_idx, item\
          \ in enumerate(iteration_results, start=1):\n        query = item.get(\"\
          query\", f\"问题 {q_idx}\")\n        \n        # 建立当前子问题的全局参考序号映射\n      \
          \  section_lines = [f\"### 子任务 {q_idx}：{query}\"]\n        \n        # 附带当前子问题检索到的摘要正文\n\
          \        sub_content = item.get(\"sub_context\", \"\")\n        section_lines.append(f\"\
          检索摘要:\\n{sub_content}\")\n        \n        merged_sections.append(\"\\\
          n\".join(section_lines))\n\n    # 产出最终全量 Prompt 文本与去重/扁平化的参考资料列表\n    return\
          \ {\n        \"total_context\": \"\\n\\n---\\n\\n\".join(merged_sections)\n\
          \    }"
        code_language: python3
        outputs:
          total_context:
            children: null
            type: string
