    - data:
        code: "import json\n\ndef main(query: str, result: str) -> dict:\n    try:\n\
          \        data = json.loads(result) if isinstance(result, str) else result\n\
          \    except Exception:\n        data = []\n\n    # 兼容 Bocha 搜索返回的各种层级结构\n\
          \    webpages = []\n    if isinstance(data, list) and len(data) > 0 and\
          \ \"webpage\" in data[0]:\n        webpages = data[0][\"webpage\"]\n   \
          \ elif isinstance(data, dict) and \"webpage\" in data:\n        webpages\
          \ = data[\"webpage\"]\n\n    page_snippets = []\n\n    # 截取前 5 条高相关性结果\n\
          \    for idx, page in enumerate(webpages[:5], start=1):\n        title =\
          \ page.get(\"name\", \"无标题\").strip()\n        url = page.get(\"url\", \"\
          \").strip()\n        pub_date = page.get(\"datePublished\", \"\")[:10]\n\
          \        content = page.get(\"summary\") or page.get(\"snippet\", \"\")\n\
          \        content = content.strip().replace(\"\\n\", \" \")\n\n        #\
          \ 核心改动：把 url 紧密贴合在资料头部，方便模型直接提取生成 Markdown 链接\n        page_snippets.append(\n\
          \            f\"- 资料{idx}: 《{title}》\\n\"\n            f\"  发布时间: {pub_date}\\\
          n\"\n            f\"  来源链接: {url}\\n\"\n            f\"  核心内容: {content}\"\
          \n        )\n\n    sub_context = \"\\n\".join(page_snippets) if page_snippets\
          \ else \"未检索到相关内容\"\n\n    # 打包为单变量 item 输出给迭代节点\n    return {\n       \
          \ \"item\": {\n            \"query\": query,\n            \"sub_context\"\
          : sub_context\n        }\n    }"
        code_language: python3
        isInIteration: true
        isInLoop: false
        iteration_id: '1789719723635'
