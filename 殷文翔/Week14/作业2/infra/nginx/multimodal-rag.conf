# Render with scripts/render_nginx.py. Review server.conf before shared inclusion.
# This loopback listener is suitable for an SSH tunnel / local acceptance.
server {
    listen 127.0.0.1:__PORT__;
    server_name localhost;
    root __STATIC_ROOT__;
    index index.html;
    client_max_body_size __MAX_BODY__;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass __API_ORIGIN__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout __TIMEOUT__s;
        proxy_read_timeout __TIMEOUT__s;
        proxy_buffering off;
        proxy_intercept_errors off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
