<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a237e" />
<title>SQL Chat · 对话查询 Chinook 数据库</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗄️</text></svg>" />
<style>
  :root {
    --primary: #1a237e;
    --primary-light: #3f51b5;
    --accent: #5c6bc0;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1b1f2a;
    --muted: #6b7280;
    --border: #e3e7f0;
    --ok: #2e7d32;
    --warn: #ef6c00;
    --err: #c62828;
    --code-bg: #0f172a;
    --radius: 16px;
    --shadow: 0 8px 24px rgba(26, 35, 126, 0.08);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI",
      "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------------- 顶栏 ---------------- */
  .header {
    flex: none;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
    padding: 14px 20px;
    padding-top: calc(14px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(26, 35, 126, 0.25);
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .logo {
    width: 36px; height: 36px; flex: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.16);
    display: grid; place-items: center;
    font-size: 18px;
  }
  .brand h1 {
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand p { margin: 2px 0 0; font-size: 12px; opacity: 0.78; white-space: nowrap; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    white-space: nowrap;
  }
  .badge.warn { background: #f57f17; }
  .icon-btn {
    border: none;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.28); }

  /* ---------------- 主体布局 ---------------- */
  .app {
    flex: 1;
    display: grid;
    grid-template-columns: 290px minmax(0, 1fr);
    overflow: hidden;
  }

  /* ---------------- 侧边栏 ---------------- */
  .sidebar {
    background: var(--card);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 18px 16px 28px;
  }
  .side-title {
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted);
    margin: 0 0 10px;
  }
  .side-section + .side-section { margin-top: 26px; }

  .table-item { border-bottom: 1px solid var(--border); }
  .table-item:last-child { border-bottom: none; }
  .table-btn {
    width: 100%;
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; padding: 9px 2px;
    font: inherit; font-size: 13.5px; color: var(--text);
    cursor: pointer; text-align: left;
  }
  .table-btn .tname { font-weight: 600; }
  .table-btn .tcount { margin-left: auto; color: var(--muted); font-size: 12px; }
  .table-btn .caret { color: var(--muted); font-size: 12px; width: 10px; flex: none; transition: transform 0.15s ease; }
  .table-item.open .caret { transform: rotate(90deg); }
  .cols { display: none; padding: 0 0 10px 2px; }
  .table-item.open .cols { display: block; }
  .col {
    display: flex; gap: 6px; font-size: 12px; color: var(--muted);
    padding: 2px 0; line-height: 1.5;
  }
  .col .pk { color: var(--warn); font-weight: 700; }

  .examples { display: flex; flex-direction: column; gap: 8px; }
  .example {
    text-align: left;
    background: #f7f8fd;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font: inherit; font-size: 13px; line-height: 1.5;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .example:hover { border-color: var(--accent); background: #eef0fb; }

  /* ---------------- 对话区 ---------------- */
  .chat-panel { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 8px;
    scroll-behavior: smooth;
  }
  .messages-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { justify-content: flex-end; }
  .avatar {
    flex: none;
    width: 32px; height: 32px;
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
  }
  .bubble {
    max-width: min(100%, 720px);
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    font-size: 14.5px;
    line-height: 1.7;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble { border-bottom-left-radius: 4px; }

  .answer { white-space: pre-wrap; }
  .answer:empty { display: none; }

  /* 执行中 */
  .progress { display: flex; flex-direction: column; gap: 6px; }
  .progress-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted); margin-bottom: 2px;
  }
  .spinner {
    width: 14px; height: 14px; flex: none;
    border: 2px solid rgba(26, 35, 126, 0.18);
    border-top-color: var(--primary-light);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .step {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12.5px; color: var(--muted);
    animation: fadeIn 0.2s ease;
  }
  .step .sicon { width: 14px; flex: none; text-align: center; font-size: 12px; }
  .step.ok .sicon { color: var(--ok); }
  .step.retry .sicon { color: var(--warn); }
  .step.error .sicon { color: var(--err); }
  .step .stitle { color: var(--text); font-weight: 600; white-space: nowrap; flex: none; }
  .step .sdetail {
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
  }
  .step .sms { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; opacity: 0.8; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  /* 执行详情 */
  .trace { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .trace > summary {
    cursor: pointer;
    list-style: none;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    display: flex; align-items: center; gap: 6px;
    user-select: none;
  }
  .trace > summary::-webkit-details-marker { display: none; }
  .trace > summary::before { content: "▸"; transition: transform 0.15s ease; display: inline-block; }
  .trace[open] > summary::before { transform: rotate(90deg); }
  .trace > summary .meta { margin-left: auto; font-weight: 400; color: var(--muted); }

  .trace-body { margin-top: 10px; display: flex; flex-direction: column; gap: 14px; }
  .section-title {
    font-size: 11.5px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .section-title .meta { text-transform: none; letter-spacing: 0; font-weight: 400; }

  .steps-list { display: flex; flex-direction: column; gap: 4px; }

  .sql-block { position: relative; }
  .sql-block pre {
    margin: 0;
    background: var(--code-bg);
    color: #e2e8f0;
    border-radius: 10px;
    padding: 12px 14px;
    padding-right: 58px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .copy-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(255, 255, 255, 0.12);
    color: #cbd5e1;
    border: none; border-radius: 7px;
    padding: 4px 8px; font-size: 11.5px;
    cursor: pointer;
  }
  .copy-btn:hover { background: rgba(255, 255, 255, 0.24); color: #fff; }

  .table-wrap {
    overflow: auto;
    max-height: 320px;
    border: 1px solid var(--border);
    border-radius: 10px;
    -webkit-overflow-scrolling: touch;
  }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td {
    padding: 7px 12px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  thead th {
    position: sticky; top: 0;
    background: #eef0f8;
    font-weight: 700;
    color: #374151;
    z-index: 1;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: #fafbff; }
  td.num { text-align: right; }

  .empty-result { color: var(--muted); font-size: 13px; padding: 10px 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eef0fb;
    color: var(--primary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .chip.warn { background: #fff4e5; color: var(--warn); }

  .error-box {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #fff2f1;
    border: 1px solid #ffd2ce;
    color: var(--err);
    font-size: 13px;
    white-space: pre-wrap;
  }

  /* ---------------- 欢迎页 ---------------- */
  .welcome { text-align: center; padding: 34px 10px 10px; }
  .welcome .big {
    width: 58px; height: 58px; margin: 0 auto 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff; display: grid; place-items: center; font-size: 26px;
    box-shadow: 0 10px 24px rgba(26, 35, 126, 0.28);
  }
  .welcome h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
  .welcome p { margin: 0 auto; max-width: 460px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
  .welcome .examples { margin: 20px auto 0; max-width: 520px; text-align: left; }

  /* ---------------- 输入区 ---------------- */
  .composer {
    flex: none;
    border-top: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  }
  .composer-inner {
    max-width: 860px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 14px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease;
  }
  .composer-inner:focus-within { border-color: var(--accent); }
  #input {
    flex: 1;
    border: none; outline: none; resize: none;
    font: inherit; font-size: 14.5px; line-height: 1.6;
    max-height: 140px;
    padding: 6px 0;
    background: transparent;
    color: var(--text);
  }
  #input::placeholder { color: #9aa1ad; }
  .send-btn {
    flex: none;
    width: 38px; height: 38px;
    border: none; border-radius: 11px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff; font-size: 16px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .composer-hint {
    max-width: 860px; margin: 8px auto 0;
    text-align: center; font-size: 11.5px; color: var(--muted);
  }

  /* ---------------- 响应式 ---------------- */
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .sidebar { display: none; }
    .messages { padding: 16px 12px 4px; }
    .composer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .bubble { font-size: 14px; }
    .brand p { display: none; }
  }
</style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo">🗄️</div>
      <div>
        <h1>SQL Chat</h1>
        <p>用自然语言对话查询 Chinook 数据库</p>
      </div>
    </div>
    <div class="header-right">
      <span class="badge" id="model-badge">连接中…</span>
      <button class="icon-btn" id="btn-new">新对话</button>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <section class="side-section">
        <h3 class="side-title">数据表</h3>
        <div id="table-list"><div class="col">加载中…</div></div>
      </section>
      <section class="side-section">
        <h3 class="side-title">示例问题</h3>
        <div class="examples" id="side-examples"></div>
      </section>
    </aside>

    <main class="chat-panel">
      <div class="messages" id="messages">
        <div class="messages-inner" id="messages-inner">
          <div class="welcome" id="welcome">
            <div class="big">💬</div>
            <h2>向数据库提问</h2>
            <p>
              输入一句中文问题，Agent 会自动完成
              <b>选表 → 写 SQL → 校验 → 执行 → 总结</b>，并把 SQL 与查询结果一并返回。
              支持连续追问，例如「那前 10 个呢？」。
            </p>
            <div class="examples" id="welcome-examples"></div>
          </div>
        </div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <textarea id="input" rows="1" placeholder="例如：每个客户的消费总额是多少？"></textarea>
          <button class="send-btn" id="btn-send" title="发送">➤</button>
        </div>
        <div class="composer-hint">Enter 发送 · Shift + Enter 换行</div>
      </div>
    </main>
  </div>

<script>
(function () {
  "use strict";

  var EXAMPLES = [
    "每个客户的消费总额是多少？",
    "各流派的歌曲数量排名？",
    "销售额最高的前 5 个国家是哪些？",
    "哪位员工负责的客户最多？",
    "最畅销的 10 首歌曲是哪些？"
  ];

  var SESSION_KEY = "sqlchat_session_id";

  var messagesEl = document.getElementById("messages");
  var innerEl = document.getElementById("messages-inner");
  var welcomeEl = document.getElementById("welcome");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("btn-send");
  var newBtn = document.getElementById("btn-new");
  var badgeEl = document.getElementById("model-badge");
  var tableListEl = document.getElementById("table-list");

  var busy = false;

  // ------------------------- 会话 ID -------------------------
  function newSessionId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }
  function getSessionId() {
    var id = null;
    try { id = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
    if (!id) { id = newSessionId(); try { sessionStorage.setItem(SESSION_KEY, id); } catch (e) {} }
    return id;
  }
  function resetSessionId() {
    var id = newSessionId();
    try { sessionStorage.setItem(SESSION_KEY, id); } catch (e) {}
    return id;
  }

  var sessionId = getSessionId();

  // ------------------------- 示例问题 -------------------------
  function renderExamples() {
    var targets = [document.getElementById("welcome-examples"), document.getElementById("side-examples")];
    targets.forEach(function (box) {
      if (!box) return;
      EXAMPLES.forEach(function (q) {
        var b = document.createElement("button");
        b.className = "example";
        b.type = "button";
        b.textContent = q;
        b.addEventListener("click", function () { send(q); });
        box.appendChild(b);
      });
    });
  }

  // ------------------------- 健康检查 / 库结构 -------------------------
  function loadHealth() {
    fetch("/api/health").then(function (r) { return r.json(); }).then(function (d) {
      if (d.mock) {
        badgeEl.textContent = "本地模拟模式";
        badgeEl.classList.add("warn");
        badgeEl.title = "未调用大模型，MOCK=1 时使用固定规则的结果";
      } else if (d.api_key_configured) {
        badgeEl.textContent = d.model || "未命名模型";
        badgeEl.title = "模型服务地址：" + (d.api_base_url || "");
      } else {
        badgeEl.textContent = "未配置 API Key";
        badgeEl.classList.add("warn");
      }
    }).catch(function () {
      badgeEl.textContent = "服务不可用";
      badgeEl.classList.add("warn");
    });
  }

  function loadSchema() {
    fetch("/api/schema").then(function (r) { return r.json(); }).then(function (d) {
      var tables = d.tables || [];
      tableListEl.innerHTML = "";
      if (!tables.length) { tableListEl.textContent = "（无表）"; return; }
      tables.forEach(function (t) {
        var item = document.createElement("div");
        item.className = "table-item";

        var btn = document.createElement("button");
        btn.className = "table-btn";
        btn.type = "button";

        var caret = document.createElement("span");
        caret.className = "caret";
        caret.textContent = "▸";

        var name = document.createElement("span");
        name.className = "tname";
        name.textContent = t.name;

        var count = document.createElement("span");
        count.className = "tcount";
        count.textContent = (t.columns || []).length + " 列";

        btn.appendChild(caret);
        btn.appendChild(name);
        btn.appendChild(count);
        btn.addEventListener("click", function () { item.classList.toggle("open"); });

        var cols = document.createElement("div");
        cols.className = "cols";
        (t.columns || []).forEach(function (c) {
          var row = document.createElement("div");
          row.className = "col";
          if (c.primary_key) {
            var pk = document.createElement("span");
            pk.className = "pk";
            pk.textContent = "PK";
            row.appendChild(pk);
          }
          var label = document.createElement("span");
          label.textContent = c.name + " · " + c.type;
          row.appendChild(label);
          cols.appendChild(row);
        });

        item.appendChild(btn);
        item.appendChild(cols);
        tableListEl.appendChild(item);
      });
    }).catch(function () {
      tableListEl.textContent = "库结构加载失败";
    });
  }

  // ------------------------- DOM 小工具 -------------------------
  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function stepIcon(status) {
    if (status === "ok") return "✓";
    if (status === "retry") return "↻";
    if (status === "error") return "✗";
    return "•";
  }

  function stepNode(step) {
    var row = el("div", "step " + (step.status || "ok"));
    row.appendChild(el("span", "sicon", stepIcon(step.status)));
    row.appendChild(el("span", "stitle", step.title || step.node || ""));
    var detail = String(step.detail || "");
    if (detail.indexOf("\n") >= 0) detail = detail.split("\n")[0];
    if (detail.length > 90) detail = detail.slice(0, 90) + "…";
    if (detail) row.appendChild(el("span", "sdetail", detail));
    if (step.elapsed_ms != null) row.appendChild(el("span", "sms", step.elapsed_ms + " ms"));
    return row;
  }

  // ------------------------- 消息气泡 -------------------------
  function addUserMessage(text) {
    var msg = el("div", "msg user");
    var bubble = el("div", "bubble");
    bubble.textContent = text;
    msg.appendChild(bubble);
    innerEl.appendChild(msg);
    scrollToBottom();
  }

  function createBotMessage() {
    var msg = el("div", "msg bot");
    var avatar = el("div", "avatar", "SQL");
    var bubble = el("div", "bubble");

    var progress = el("div", "progress");
    var title = el("div", "progress-title");
    title.appendChild(el("span", "spinner"));
    title.appendChild(el("span", null, "正在执行…"));
    progress.appendChild(title);
    var stepsBox = el("div", "steps-list");
    progress.appendChild(stepsBox);

    bubble.appendChild(progress);
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    innerEl.appendChild(msg);
    scrollToBottom();

    return { msg: msg, bubble: bubble, progress: progress, title: title, stepsBox: stepsBox };
  }

  function renderSteps(container, steps) {
    container.innerHTML = "";
    steps.forEach(function (s) { container.appendChild(stepNode(s)); });
  }

  function renderTable(columns, rows) {
    if (!rows || !rows.length) return el("div", "empty-result", "（无结果）");
    var wrap = el("div", "table-wrap");
    var table = el("table");
    var thead = el("thead");
    var htr = el("tr");
    columns.forEach(function (c) { htr.appendChild(el("th", null, c)); });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = el("tbody");
    rows.forEach(function (row) {
      var tr = el("tr");
      row.forEach(function (cell) {
        var td = el("td");
        if (typeof cell === "number") td.className = "num";
        td.textContent = (cell === null || cell === undefined) ? "" : String(cell);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function renderAnswer(target, data) {
    target.innerHTML = "";

    var answer = el("div", "answer");
    answer.textContent = data.answer || (data.failed ? "（未生成回答）" : "");
    target.appendChild(answer);

    // 表选择 / 重试次数等概览
    var chips = el("div", "chips");
    chips.style.marginTop = "10px";
    (data.tables || []).forEach(function (t) { chips.appendChild(el("span", "chip", t)); });
    if (data.retries > 0) chips.appendChild(el("span", "chip warn", "改写 " + data.retries + " 次"));
    if (chips.children.length) target.appendChild(chips);

    var trace = el("details", "trace");
    var steps = data.steps || [];
    var totalMs = "";
    if (data.elapsed_ms != null) {
      totalMs = data.elapsed_ms >= 1000
        ? (data.elapsed_ms / 1000).toFixed(1) + "s"
        : data.elapsed_ms + "ms";
    }
    var summary = el("summary");
    summary.appendChild(el("span", null, "执行详情"));
    summary.appendChild(el("span", "meta", steps.length + " 步" + (totalMs ? " · " + totalMs : "")));
    trace.appendChild(summary);

    var body = el("div", "trace-body");

    // 步骤时间线
    var stepsTitle = el("div", "section-title", "执行过程");
    body.appendChild(stepsTitle);
    var stepsList = el("div", "steps-list");
    renderSteps(stepsList, steps);
    body.appendChild(stepsList);

    // SQL
    if (data.sql) {
      body.appendChild(el("div", "section-title", "执行 SQL"));
      var sqlBlock = el("div", "sql-block");
      var pre = el("pre");
      var code = el("code");
      code.textContent = data.sql;
      pre.appendChild(code);
      var copyBtn = el("button", "copy-btn", "复制");
      copyBtn.type = "button";
      copyBtn.addEventListener("click", function () {
        var text = data.sql;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            copyBtn.textContent = "已复制";
            setTimeout(function () { copyBtn.textContent = "复制"; }, 1500);
          });
        }
      });
      sqlBlock.appendChild(pre);
      sqlBlock.appendChild(copyBtn);
      body.appendChild(sqlBlock);
    }

    // 结果表
    if (data.columns && data.columns.length) {
      var resultTitle = el("div", "section-title");
      resultTitle.appendChild(el("span", null, "查询结果"));
      var meta = (data.row_count != null ? data.row_count : data.rows.length) + " 行";
      if (data.truncated) meta += "（仅展示前 " + data.rows.length + " 行）";
      resultTitle.appendChild(el("span", "meta", meta));
      body.appendChild(resultTitle);
      body.appendChild(renderTable(data.columns, data.rows));
    }

    trace.appendChild(body);
    trace.open = true;
    target.appendChild(trace);
  }

  function showError(target, message) {
    var box = el("div", "error-box", message);
    target.appendChild(box);
  }

  // ------------------------- SSE 解析 -------------------------
  function parseEventBlock(raw) {
    var event = "message";
    var dataLines = [];
    raw.split("\n").forEach(function (line) {
      if (line.indexOf("event:") === 0) event = line.slice(6).trim();
      else if (line.indexOf("data:") === 0) dataLines.push(line.slice(5).trim());
    });
    var data = null;
    if (dataLines.length) {
      try { data = JSON.parse(dataLines.join("\n")); } catch (e) { data = null; }
    }
    return { event: event, data: data };
  }

  async function streamChat(message, ui) {
    var resp = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: message, session_id: sessionId })
    });

    if (!resp.ok || !resp.body) {
      var detail = "请求失败（" + resp.status + "）";
      try {
        var errJson = await resp.json();
        if (errJson && errJson.detail) detail = errJson.detail;
      } catch (e) {}
      throw new Error(detail);
    }

    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = "";
    var liveSteps = [];

    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });

      var idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        var raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        var evt = parseEventBlock(raw);
        if (!evt.data) continue;

        if (evt.event === "step") {
          liveSteps.push(evt.data);
          ui.stepsBox.appendChild(stepNode(evt.data));
          scrollToBottom();
        } else if (evt.event === "done") {
          ui.title.innerHTML = "";
          ui.title.appendChild(el("span", null, "已完成"));
          ui.progress.remove();
          renderAnswer(ui.bubble, evt.data);
          ui.msg.scrollIntoView({ block: "start", behavior: "smooth" });
          return evt.data;
        } else if (evt.event === "error") {
          throw new Error(evt.data.message || "执行失败");
        }
      }
    }
  }

  // ------------------------- 发送 -------------------------
  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
    inputEl.disabled = value;
    if (!value) inputEl.focus();
  }

  async function send(text) {
    var message = (text != null ? text : inputEl.value).trim();
    if (!message || busy) return;

    if (welcomeEl) { welcomeEl.style.display = "none"; }

    inputEl.value = "";
    autoGrow();
    setBusy(true);

    addUserMessage(message);
    var ui = createBotMessage();

    try {
      await streamChat(message, ui);
    } catch (err) {
      ui.progress.remove();
      showError(ui.bubble, err && err.message ? err.message : "请求失败，请稍后重试。");
      scrollToBottom();
    } finally {
      setBusy(false);
    }
  }

  // ------------------------- 输入框 -------------------------
  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  }

  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener("click", function () { send(); });

  newBtn.addEventListener("click", function () {
    if (busy) return;
    var old = sessionId;
    sessionId = resetSessionId();
    fetch("/api/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: old })
    }).catch(function () {});

    Array.prototype.slice.call(innerEl.children).forEach(function (child) {
      if (child !== welcomeEl) innerEl.removeChild(child);
    });
    if (welcomeEl) welcomeEl.style.display = "";
    inputEl.focus();
  });

  // ------------------------- 启动 -------------------------
  renderExamples();
  loadHealth();
  loadSchema();
  autoGrow();
})();
</script>
</body>
</html>
