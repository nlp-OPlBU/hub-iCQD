# 多模态 RAG 问答 —— Kafka（KRaft 单节点，免 ZooKeeper）
#
#   docker compose up -d          # 启动
#   docker compose logs -f kafka  # 看日志
#   docker compose down           # 停止（加 -v 会连数据一起删）
#
# 宿主机连接地址：localhost:9092（对应 .env 里的 KAFKA_BOOTSTRAP_SERVERS）
services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: mmrag-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"      # 宿主机 -> 客户端协议端口
    environment:
      # ---- KRaft 单节点角色 ----
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # ---- 监听器：INTERNAL 给容器内互访，EXTERNAL 给宿主机（我们的 Web/Worker）----
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # ---- topic 默认行为：本地开发友好（单分区、单副本、允许自动建 topic）----
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  kafka-data:
