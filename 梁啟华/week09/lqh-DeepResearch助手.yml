    - data:
        code: "\nimport json\n\ndef main(bocha_response) -> dict:\n    \"\"\"\n  \
          \  从博查搜索结果中提取所有网页 URL。\n    输入 bocha_response 可以是 JSON 字符串或已解析的字典。\n   \
          \ 返回 {\"urls\": [\"url1\", \"url2\", ...]}\n    \"\"\"\n    # 1. 如果输入是字符串，尝试解析成字典\n\
          \    if isinstance(bocha_response, str):\n        try:\n            data\
          \ = json.loads(bocha_response)\n        except json.JSONDecodeError:\n \
          \           return {\"urls\": []}\n    elif isinstance(bocha_response, dict):\n\
          \        data = bocha_response\n    else:\n        return {\"urls\": []}\n\
          \n    # 2. 按路径提取 URL 列表\n    urls = []\n    try:\n        web_pages = data.get(\"\
          data\", {}).get(\"webPages\", {})\n        value_list = web_pages.get(\"\
          value\", [])\n        if isinstance(value_list, list):\n            for\
          \ item in value_list:\n                if isinstance(item, dict) and \"\
          url\" in item:\n                    urls.append(item[\"url\"])\n    except\
          \ Exception:\n        # 任何异常都返回空列表，避免工作流中断\n        pass\n\n    return {\"\
          urls\": urls}"
        code_language: python3
