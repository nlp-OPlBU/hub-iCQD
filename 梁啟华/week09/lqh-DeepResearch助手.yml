    - data:
        code: "\nimport json\nimport re\ndef main(llm_output: str) -> dict:\n    text\
          \ = llm_output.strip()\n\n    # 1. 去掉可能出现的 Markdown 代码块标记 ```json ... ```\n\
          \    text = re.sub(r\"^```(?:json)?\\s*\", \"\", text, flags=re.I)\n   \
          \ text = re.sub(r\"\\s*```$\", \"\", text)\n\n    # 2. 解析 JSON\n    try:\n\
          \        result = json.loads(text)\n    except json.JSONDecodeError:\n \
          \       # 容错：尝试从文本中提取第一个 JSON 数组\n        match = re.search(r\"\\[[\\s\\\
          S]*\\]\", text)\n        if not match:\n            return {\"sub_questions\"\
          : []}\n        try:\n            result = json.loads(match.group(0))\n \
          \       except json.JSONDecodeError:\n            return {\"sub_questions\"\
          : []}\n\n    # 3. 确保结果是列表\n    if not isinstance(result, list):\n      \
          \  result = [result]\n\n    # 4. 过滤空值，并统一转成字符串\n    sub_questions = [str(item).strip()\
          \ for item in result if str(item).strip()]\n\n    return {\"result\": result}"
