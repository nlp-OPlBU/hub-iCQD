<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SQL Agent · 自然语言查询</title>
  <meta name="description" content="用自然语言向 SQL Agent 提问，查看生成的 SQL、执行过程与查询结果。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="7" ry="3"></ellipse>
            <path d="M5 5v6c0 1.66 3.13 3 7 3s7-1.34 7-3V5"></path>
            <path d="M5 11v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>SQL Agent</h1>
          <p class="subtitle">用自然语言查询数据 · LangGraph</p>
        </div>
      </div>
      <div class="header-actions">
        <span id="status-pill" class="status-pill status--checking">
          <span class="dot"></span>
          <span id="status-text">连接中</span>
        </span>
        <button id="new-chat" type="button" class="ghost-button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          新对话
        </button>
      </div>
    </header>

    <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>

    <main id="chat" class="chat">
      <section id="welcome" class="welcome">
        <div class="welcome-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a4 4 0 0 1-4 4H8l-4 3v-3.5A4 4 0 0 1 3 15V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
            <path d="M8 9h8M8 13h5"></path>
          </svg>
        </div>
        <h2>有什么数据想查？</h2>
        <p>用中文直接提问，Agent 会自动选表、生成 SQL、校验并执行，然后给出回答。</p>
        <div class="suggestions" id="suggestions">
          <button type="button" class="suggestion" data-question="customers 表一共有多少条记录？">customers 表一共有多少条记录？</button>
          <button type="button" class="suggestion" data-question="发票总金额是多少？">发票总金额是多少？</button>
          <button type="button" class="suggestion" data-question="不同国家的客户数量分别是多少？">不同国家的客户数量分别是多少？</button>
        </div>
      </section>

      <div id="messages" class="messages" aria-live="polite"></div>
    </main>

    <footer class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <textarea
          id="input"
          rows="1"
          maxlength="2000"
          placeholder="输入问题，例如：customers 表一共有多少条记录？"
          aria-label="输入问题"
        ></textarea>
        <button id="send" class="send-button" type="submit" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2 11 13"></path>
            <path d="M22 2 15 22l-4-9-9-4z"></path>
          </svg>
        </button>
      </form>
      <div class="composer-hint">
        <span>Enter 发送 · Shift + Enter 换行</span>
        <span id="db-hint"></span>
      </div>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
